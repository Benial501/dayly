<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F1FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Il tuo spazio personale per giornate più leggere." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <title>DAYLY — il tuo spazio quotidiano</title>
    <style>
      /* Schermata d'apertura: sta qui e non nel bundle, così compare
         subito, prima ancora che l'app venga caricata. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #F1F1FA;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        transition: opacity .45s ease, transform .45s ease;
      }
      #splash.is-gone { opacity: 0; transform: scale(1.04); pointer-events: none; }

      #splash .cal { width: 132px; height: 132px; overflow: visible; }
      #splash .cal * { transform-box: fill-box; transform-origin: center; }

      /* il foglio si disegna */
      #splash .sheet {
        fill: none;
        stroke: #15151F;
        stroke-width: 3.2;
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: cal-draw .8s cubic-bezier(.4, .1, .2, 1) .1s forwards;
      }
      /* i due anelli scendono a incastrarsi */
      #splash .ring {
        stroke: #15151F;
        stroke-width: 3.2;
        stroke-linecap: round;
        opacity: 0;
        animation: cal-ring .4s cubic-bezier(.2, .9, .3, 1.4) .55s forwards;
      }
      #splash .ring.b { animation-delay: 0.663s; }
      #splash .divider {
        stroke: #DEDEEE;
        stroke-width: 2.4;
        stroke-dasharray: 96;
        stroke-dashoffset: 96;
        animation: cal-draw .45s ease .8s forwards;
      }
      /* i giorni compaiono uno dopo l'altro */
      #splash .day {
        fill: #DEDEEE;
        opacity: 0;
        animation: cal-day .36s cubic-bezier(.2, .9, .3, 1.5) forwards;
      }
      /* la pillola del giorno scelto, e la spunta che ci si disegna sopra */
      #splash .pill {
        fill: #6B5CE7;
        opacity: 0;
        animation: cal-pill .45s cubic-bezier(.2, .9, .3, 1.5) 1.62s forwards;
      }
      #splash .tick {
        fill: none;
        stroke: #fff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 22;
        stroke-dashoffset: 22;
        animation: cal-draw .4s ease 1.92s forwards;
      }

      #splash .word {
        font-family: Manrope, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -1.1px;
        color: #15151F;
        opacity: 0;
        animation: cal-word .5s ease 1.95s forwards;
      }
      #splash .word span { color: #6B5CE7; }

      @keyframes cal-draw { to { stroke-dashoffset: 0; } }
      @keyframes cal-ring {
        from { opacity: 0; transform: translateY(-7px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cal-day {
        from { opacity: 0; transform: scale(.2); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cal-pill {
        from { opacity: 0; transform: scale(.4); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cal-word {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sheet, #splash .ring, #splash .divider,
        #splash .day, #splash .pill, #splash .tick, #splash .word {
          animation-duration: .01ms;
          animation-delay: 0ms;
          opacity: 1;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <svg class="cal" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line class="ring" x1="42" y1="14" x2="42" y2="30" />
        <line class="ring b" x1="78" y1="14" x2="78" y2="30" />
        <rect class="sheet" x="12" y="22" width="96" height="86" rx="16" />
        <line class="divider" x1="12" y1="46" x2="108" y2="46" />
        <rect class="day" x="22.5" y="58.5" width="7" height="7" rx="2.4" style="animation-delay: 0.900s" />
        <rect class="day" x="40.5" y="58.5" width="7" height="7" rx="2.4" style="animation-delay: 0.945s" />
        <rect class="day" x="58.5" y="58.5" width="7" height="7" rx="2.4" style="animation-delay: 0.990s" />
        <rect class="day" x="76.5" y="58.5" width="7" height="7" rx="2.4" style="animation-delay: 1.035s" />
        <rect class="day" x="94.5" y="58.5" width="7" height="7" rx="2.4" style="animation-delay: 1.080s" />
        <rect class="day" x="22.5" y="74.5" width="7" height="7" rx="2.4" style="animation-delay: 1.125s" />
        <rect class="day" x="40.5" y="74.5" width="7" height="7" rx="2.4" style="animation-delay: 1.170s" />
        <rect class="day" x="76.5" y="74.5" width="7" height="7" rx="2.4" style="animation-delay: 1.260s" />
        <rect class="day" x="94.5" y="74.5" width="7" height="7" rx="2.4" style="animation-delay: 1.305s" />
        <rect class="day" x="22.5" y="90.5" width="7" height="7" rx="2.4" style="animation-delay: 1.350s" />
        <rect class="day" x="40.5" y="90.5" width="7" height="7" rx="2.4" style="animation-delay: 1.395s" />
        <rect class="day" x="58.5" y="90.5" width="7" height="7" rx="2.4" style="animation-delay: 1.440s" />
        <rect class="day" x="76.5" y="90.5" width="7" height="7" rx="2.4" style="animation-delay: 1.485s" />
        <rect class="day" x="94.5" y="90.5" width="7" height="7" rx="2.4" style="animation-delay: 1.530s" />
        <rect class="pill" x="51" y="69" width="22" height="18" rx="9" />
        <path class="tick" d="M57 78 l3.6 3.8 l6.6 -7.6" />
      </svg>
      <div class="word">dayly<span>.</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
