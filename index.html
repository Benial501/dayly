<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F1FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Il tuo spazio personale per giornate più leggere." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <title>DAYLY — il tuo spazio quotidiano</title>
    <style>
      /* Schermata d'apertura: sta qui e non nel bundle, così compare
         subito, prima ancora che l'app venga caricata. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #F1F1FA;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        transition: opacity .45s ease, transform .45s ease;
      }
      #splash.is-gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash img {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        object-fit: cover;
        box-shadow: 0 18px 40px -18px rgba(32, 30, 76, .5);
        animation: splash-mark .7s cubic-bezier(.2, .9, .3, 1.2) both,
                   splash-breathe 2.8s ease-in-out .75s infinite;
      }
      #splash .word {
        font-family: Manrope, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -1.2px;
        color: #15151F;
        animation: splash-word .55s ease .18s both;
      }
      #splash .word span { color: #6B5CE7; }
      #splash .trace {
        width: 54px;
        height: 3px;
        border-radius: 99px;
        background: #DEDEEE;
        overflow: hidden;
      }
      #splash .trace i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: #6B5CE7;
        animation: splash-trace 1.5s ease-in-out .35s infinite;
      }
      @keyframes splash-mark {
        from { opacity: 0; transform: translateY(14px) scale(.82); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-word {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-breathe {
        0%, 100% { transform: none; box-shadow: 0 18px 40px -18px rgba(32, 30, 76, .5); }
        50% { transform: translateY(-5px) scale(1.025); box-shadow: 0 26px 48px -18px rgba(32, 30, 76, .42); }
      }
      @keyframes splash-trace {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .word, #splash .trace i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <img src="/logo.jpg" alt="" />
      <div class="word">dayly<span>.</span></div>
      <div class="trace"><i></i></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
